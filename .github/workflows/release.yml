name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri App
        run: npm run tauri build
        env:
          JWT_SECRET: "dummy_secret_for_build_only_1234567890"
          ADMIN_PASSWORD_HASH: "dummy_hash_for_build_only"

      - name: Copy Tauri Outputs to dist
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp src-tauri/target/release/bundle/nsis/*.exe dist/ || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp src-tauri/target/release/bundle/dmg/*.dmg dist/ || true
          else
            cp src-tauri/target/release/bundle/appimage/*.AppImage dist/ || true
            cp src-tauri/target/release/bundle/deb/*.deb dist/ || true
          fi

      - name: Build CLI Executable
        shell: bash
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            if (!fs.existsSync('dist')) fs.mkdirSync('dist');
            const osMap = { win32: 'windows', darwin: 'mac', linux: 'linux' };
            const os = osMap[process.platform] || process.platform;
            const arch = process.arch;
            let targetName = 'Docker-Manager-CLI-' + os + '-' + arch;
            if (process.platform === 'win32') targetName += '.exe';
            execSync('npx caxa -i \".next/standalone\" -o \"dist/' + targetName + '\" -- \"{{caxa}}/node\" \"{{caxa}}/start.js\"', { stdio: 'inherit' });
          "

      - name: Upload Artifacts to Action
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: dist/*
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/Docker-Manager-CLI-mac-*
            dist/Docker-Manager-CLI-linux-*
          fail_on_unmatched_files: false
          generate_release_notes: true
