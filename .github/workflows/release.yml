name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          JWT_SECRET: "dummy_secret_for_build_only_1234567890"
          ADMIN_PASSWORD_HASH: "dummy_hash_for_build_only"

      - name: Prepare Standalone Assets
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const { execSync } = require('child_process');
            if (!fs.existsSync('.next/standalone/public')) {
              if (process.platform === 'win32') execSync('xcopy /E /I /Y public .next\\\\standalone\\\\public\\\\');
              else execSync('cp -r public .next/standalone/public');
            }
            if (!fs.existsSync('.next/standalone/.next/static')) {
              if (process.platform === 'win32') execSync('xcopy /E /I /Y .next\\\\static .next\\\\standalone\\\\.next\\\\static\\\\');
              else execSync('cp -r .next/static .next/standalone/.next/static');
            }
            fs.copyFileSync('start.js', '.next/standalone/start.js');
          "

      - name: Build Electron App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:electron:win
        continue-on-error: true

      - name: Build Electron App (Mac)
        if: matrix.os == 'macos-latest'
        run: npm run build:electron:mac
        continue-on-error: true

      - name: Build Electron App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run build:electron:linux
        continue-on-error: true

      - name: Build CLI Executable
        shell: bash
        run: |
          node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            if (!fs.existsSync('dist')) fs.mkdirSync('dist');
            const osMap = { win32: 'windows', darwin: 'mac', linux: 'linux' };
            const os = osMap[process.platform] || process.platform;
            const arch = process.arch;
            let targetName = 'Docker-Manager-CLI-' + os + '-' + arch;
            if (process.platform === 'win32') targetName += '.exe';
            execSync('npx caxa -i \".next/standalone\" -o \"dist/' + targetName + '\" -- \"{{caxa}}/node\" \"{{caxa}}/start.js\"', { stdio: 'inherit' });
          "

      - name: Upload Artifacts to Action
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: dist/*
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
            dist/Docker-Manager-CLI-*
          fail_on_unmatched_files: false
          generate_release_notes: true
